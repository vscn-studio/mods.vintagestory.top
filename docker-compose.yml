services:
  db:
    image: postgres:16-alpine
    container_name: vscn_mod_db_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vscn_mod_db}
      POSTGRES_USER: ${POSTGRES_USER:-vscn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vscn_dev_password}
    ports:
      # 宿主机默认使用 5433，避免与已有 PostgreSQL 的 5432 端口冲突。
      # Compose 内部的应用仍通过 db:5432 访问数据库。
      - "${POSTGRES_BIND_HOST:-127.0.0.1}:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - mod_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vscn_mod_db_web
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      OIDC_ISSUER: ${OIDC_ISSUER:-https://connect.vintagestory.top}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      COMMUNITY_ADMIN_GROUP: ${COMMUNITY_ADMIN_GROUP:-管理员}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      WEB_URL: ${WEB_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      MOD_AUTH_SESSION_SECRET: ${MOD_AUTH_SESSION_SECRET:-}
      MOD_AUTH_DATA_DIR: ${MOD_AUTH_DATA_DIR:-/app/data}
      DATABASE_URL: ${DATABASE_URL:-postgresql://vscn:vscn_dev_password@db:5432/vscn_mod_db?schema=public}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_DIR: ${STORAGE_LOCAL_DIR:-/app/data/objects}
      STORAGE_S3_PROVIDER: ${STORAGE_S3_PROVIDER:-s3}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-auto}
      STORAGE_S3_FORCE_PATH_STYLE: ${STORAGE_S3_FORCE_PATH_STYLE:-false}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-}
      STORAGE_S3_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY:-}
      STORAGE_S3_SECRET_KEY: ${STORAGE_S3_SECRET_KEY:-}
      STORAGE_S3_SIGNED_URL_TTL: ${STORAGE_S3_SIGNED_URL_TTL:-300}
      STORAGE_DOGECLOUD_API_BASE: ${STORAGE_DOGECLOUD_API_BASE:-https://api.dogecloud.com}
      STORAGE_DOGECLOUD_BUCKET: ${STORAGE_DOGECLOUD_BUCKET:-}
      STORAGE_DOGECLOUD_ACCESS_KEY: ${STORAGE_DOGECLOUD_ACCESS_KEY:-}
      STORAGE_DOGECLOUD_SECRET_KEY: ${STORAGE_DOGECLOUD_SECRET_KEY:-}
      VS_AUTH3_LOGIN_URL: ${VS_AUTH3_LOGIN_URL:-https://auth3.vintagestory.at/v2/gamelogin}
      VS_API_LATEST_UNSTABLE_URL: ${VS_API_LATEST_UNSTABLE_URL:-https://api.vintagestory.at/latestunstable.txt}
    ports:
      # 只允许本机反向代理访问，避免 Docker 端口直接暴露到公网。
      - "${WEB_BIND_HOST:-127.0.0.1}:${WEB_PORT:-3100}:3100"
    volumes:
      - mod_auth_data:${MOD_AUTH_DATA_DIR:-/app/data}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: vscn_mod_db_migrate
    environment:
      # Keep the migration container on the Compose service name by default.
      # Set MIGRATION_DATABASE_URL explicitly only when the database is hosted
      # outside this Compose project.
      DATABASE_URL: ${MIGRATION_DATABASE_URL:-postgresql://vscn:vscn_dev_password@db:5432/vscn_mod_db?schema=public}
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  mod_auth_data:
  mod_db_data:
